name: Supabase keep-alive

# Free Supabase projects pause after a week with no activity.
# This sends one small read every 3 days so the project stays awake.
on:
  schedule:
    - cron: "0 1 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "Add SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY in the repo secrets first."
            exit 0
          fi
          curl -fsS "$URL/rest/v1/jobs?select=id&limit=1" -H "apikey: $KEY" -o /dev/null
          echo "Supabase answered."
