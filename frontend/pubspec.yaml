name: careerbridge_ai
description: "CareerBridge AI, an AI resume and career recommendation system (Flutter web + Android)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  go_router: ^18.1.0
  flutter_riverpod: ^3.4.3
  supabase_flutter: ^2.18.3
  http: ^1.6.0
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Atkinson Hyperlegible
      fonts:
        - asset: assets/fonts/atkinson/AtkinsonHyperlegible-Regular.ttf
          weight: 400
        - asset: assets/fonts/atkinson/AtkinsonHyperlegible-Bold.ttf
          weight: 700
        - asset: assets/fonts/atkinson/AtkinsonHyperlegible-Italic.ttf
          style: italic
